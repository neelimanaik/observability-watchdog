<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ title | default("Observability Watchdog") }}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    nav { background: #1e293b; border-bottom: 1px solid #334155; padding: .75rem 1.5rem; display: flex; align-items: center; gap: 2rem; }
    nav h1 { font-size: 1.1rem; font-weight: 700; color: #38bdf8; letter-spacing: .05em; }
    nav a { color: #94a3b8; text-decoration: none; font-size: .9rem; }
    nav a:hover, nav a.active { color: #e2e8f0; }
    main { padding: 1.5rem; max-width: 1400px; margin: 0 auto; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: .5rem; padding: 1.25rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
    .stat-card { text-align: center; }
    .stat-card .num { font-size: 2rem; font-weight: 700; }
    .stat-card .label { font-size: .8rem; color: #94a3b8; margin-top: .25rem; }
    h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; color: #cbd5e1; }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th { text-align: left; color: #64748b; font-weight: 600; padding: .5rem; border-bottom: 1px solid #334155; }
    td { padding: .5rem; border-bottom: 1px solid #1e293b; vertical-align: top; }
    tr:hover td { background: #0f172a; }
    .badge { display: inline-block; padding: .15rem .45rem; border-radius: .25rem; font-size: .75rem; font-weight: 600; }
    .badge-info    { background: #0ea5e9; color: #fff; }
    .badge-warn    { background: #f59e0b; color: #000; }
    .badge-error   { background: #ef4444; color: #fff; }
    .badge-critical{ background: #7c3aed; color: #fff; }
    .badge-high    { background: #ef4444; color: #fff; }
    .badge-medium  { background: #f59e0b; color: #000; }
    .badge-low     { background: #22c55e; color: #000; }
    .gap { margin-top: 1rem; }
    button { cursor: pointer; border: none; border-radius: .25rem; padding: .3rem .75rem; font-size: .8rem; }
    .btn-ack { background: #22c55e; color: #000; }
    .btn-ack:hover { background: #16a34a; }
    canvas { max-height: 220px; }
    .llm-analysis { margin-top:.5rem; padding:.6rem .75rem; background:#0f172a; border-left:3px solid #38bdf8; border-radius:.25rem; font-size:.8rem; color:#cbd5e1; line-height:1.5; white-space:pre-wrap; }
    details summary { list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    .badge-cat-database        { background:#0ea5e9; color:#fff; }
    .badge-cat-network         { background:#f59e0b; color:#000; }
    .badge-cat-authentication  { background:#7c3aed; color:#fff; }
    .badge-cat-memory-resource { background:#ef4444; color:#fff; }
    .badge-cat-application     { background:#22c55e; color:#000; }
    .badge-cat-unknown         { background:#475569; color:#fff; }
  </style>
</head>
<body>
<nav>
  <h1>⚡ Watchdog</h1>
  <a href="/" class="{{ 'active' if active == 'dashboard' }}">Dashboard</a>
  <a href="/ui/events" class="{{ 'active' if active == 'events' }}">Events</a>
  <a href="/ui/alerts" class="{{ 'active' if active == 'alerts' }}">Alerts</a>
  <a href="/docs" target="_blank">API Docs</a>
</nav>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
